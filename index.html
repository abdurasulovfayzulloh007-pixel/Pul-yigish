<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pul yig'ish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
window.onerror = function(msg, url, line, col, error){
  var app = document.getElementById('app');
  if(app){
    app.innerHTML = '<div style="padding:20px;color:#A24630;font-family:monospace;font-size:13px;white-space:pre-wrap;">Xatolik chiqdi:\n\n' + msg + '\n\nQator: ' + line + '</div>';
  }
};
</script>
<style>
  :root{
    --bg:#F3F6EF;
    --surface:#FFFFFF;
    --ink:#1E2B22;
    --ink-soft:#5C6B5F;
    --gold:#B98A2E;
    --gold-soft:#F1E3C4;
    --paid:#3E7A52;
    --paid-soft:#E3F0E6;
    --pending:#A24630;
    --pending-soft:#F6E4DE;
    --border:#DCE3D6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    padding:22px 16px 100px;
  }
  header{margin-bottom:16px;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .subtitle{color:var(--ink-soft);font-size:14px;margin:0;}
  .reset-link{
    margin-top:8px;border:none;background:none;color:var(--ink-soft);
    font-size:12px;text-decoration:underline;cursor:pointer;padding:0;
  }

  .tabs-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 2px 10px;
    -webkit-overflow-scrolling:touch;
  }
  .tabs-row::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex-shrink:0;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    font-size:14px;
    font-weight:600;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }
  .tab-btn.add-tab{
    background:var(--gold-soft);
    color:var(--gold);
    border-color:var(--gold-soft);
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }

  .target-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .target-label{font-size:13px;color:var(--ink-soft);}
  .target-value{
    font-family:'Fraunces',serif;font-size:22px;font-weight:500;color:var(--gold);
    display:flex;align-items:baseline;gap:4px;
  }
  .target-value input{
    font-family:'Fraunces',serif;font-size:22px;font-weight:500;color:var(--gold);
    border:none;background:transparent;width:120px;text-align:right;outline:none;
    border-bottom:1px solid var(--gold);
  }
  .btn-row{display:flex;gap:8px;}
  .edit-btn{
    border:none;background:var(--gold-soft);color:var(--gold);font-size:13px;font-weight:600;
    padding:7px 12px;border-radius:8px;cursor:pointer;
  }
  .remove-campaign-btn{
    border:none;background:var(--pending-soft);color:var(--pending);font-size:13px;font-weight:600;
    padding:7px 12px;border-radius:8px;cursor:pointer;
  }
  .edit-btn:active,.remove-campaign-btn:active{opacity:0.7;}

  .progress-card{padding:16px;}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .progress-sum{font-family:'Fraunces',serif;font-size:19px;font-weight:500;}
  .progress-sum .of{font-size:14px;color:var(--ink-soft);font-weight:400;font-family:'Inter',sans-serif;}
  .progress-people{font-size:13px;color:var(--ink-soft);}
  .bar{height:8px;background:var(--border);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--paid);border-radius:5px;transition:width 0.4s ease;}

  .search-wrap{margin-bottom:10px;}
  .search-input{
    width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;
    padding:11px 14px;font-size:14px;font-family:'Inter',sans-serif;outline:none;color:var(--ink);
  }
  .search-input:focus{border-color:var(--gold);}

  .list-label{font-size:13px;color:var(--ink-soft);margin:6px 2px 8px;display:flex;justify-content:space-between;}

  .person{
    display:flex;align-items:center;justify-content:space-between;background:var(--surface);
    border:1px solid var(--border);border-radius:12px;padding:12px 12px 12px 14px;margin-bottom:8px;
    border-left:4px solid var(--pending);transition:border-color 0.2s ease;
  }
  .person.paid{border-left-color:var(--paid);}
  .person-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .person-name{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .status-btn{
    border:none;font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;
    white-space:nowrap;flex-shrink:0;
  }
  .status-btn.pending{background:var(--pending-soft);color:var(--pending);}
  .status-btn.paid{background:var(--paid-soft);color:var(--paid);}
  .status-btn:active{opacity:0.7;}
  .delete-btn{
    border:none;background:none;color:var(--ink-soft);font-size:18px;cursor:pointer;
    padding:0 0 0 8px;line-height:1;flex-shrink:0;
  }

  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:28px 10px;}

  .add-campaign-form{
    display:flex;gap:8px;margin-bottom:14px;
  }
  .add-campaign-form input{
    flex:1;border:1px solid var(--gold);background:var(--surface);border-radius:10px;
    padding:10px 12px;font-size:14px;outline:none;color:var(--ink);
  }
  .add-campaign-form button{
    border:none;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;
    padding:0 14px;border-radius:10px;cursor:pointer;
  }

  .add-bar{
    position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:12px 16px;
    background:linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .add-bar-inner{width:100%;max-width:460px;display:flex;gap:8px;}
  .add-bar input{
    flex:1;border:1px solid var(--border);background:var(--surface);border-radius:10px;
    padding:12px 14px;font-size:15px;font-family:'Inter',sans-serif;outline:none;color:var(--ink);
  }
  .add-bar input:focus{border-color:var(--gold);}
  .add-btn{
    border:none;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;
    padding:0 18px;border-radius:10px;cursor:pointer;
  }
  .add-btn:active{opacity:0.8;}

  .loading{text-align:center;color:var(--ink-soft);padding:60px 0;font-size:14px;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading">Yuklanmoqda...</div>
</div>

<script>
const STORAGE_KEY = 'yigim-data';

const DEFAULT_NAMES = [
  "Mavzunaxon","Solihabonu","Qudratjon","Muxarramoy","Fayzulloh","Gulira'no",
  "Maxfiratoy","Mavludaxon","Farzonaxon","Muhammadali","Nafisaxon","Barhayotjon",
  "Zilolaxon","Rayhona","Zilolaxon","Mohinur","Kumushbibi","Robiyaxon","Mohlaroy",
  "Muhammaddiyor","Mubinaxon","Abubakr","Saidolimxon","Abdulbori","Abduqahhor",
  "Abdusalom","Abdurahmon","Bibisora","Muhammadsaid","Oyazimxon","Muslimaxon",
  "Zuhriddin","Solihabonu","Muazina","Muhammadaziz"
];

let data = null;
let loaded = false;
let searchQuery = '';
let showAddCampaignForm = false;
let editingTarget = false;
let showStats = false;

const inTelegram = !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage);
if(window.Telegram && window.Telegram.WebApp){
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

function formatSum(n){
  return Number(n || 0).toLocaleString('ru-RU').replace(/,/g,' ') + " so'm";
}

function defaultData(){
  const campaignId = 'c1';
  const people = DEFAULT_NAMES.map((name, i) => ({ id: 'p' + i, name: name }));
  return {
    campaigns: [{ id: campaignId, amount: 50000 }],
    activeCampaignId: campaignId,
    people: people,
    payments: { [campaignId]: {} }
  };
}

// Eski (bitta to'lov turli) formatdagi ma'lumotni yangi (bir nechta tur) formatga o'tkazish
function migrate(old){
  if(old && old.campaigns) return old;
  if(old && old.people){
    const campaignId = 'c1';
    const payments = { [campaignId]: {} };
    (old.people || []).forEach(p => {
      if(p.paid) payments[campaignId][p.id] = true;
    });
    return {
      campaigns: [{ id: campaignId, amount: old.target || 0 }],
      activeCampaignId: campaignId,
      people: (old.people || []).map(p => ({ id: p.id, name: p.name })),
      payments: payments
    };
  }
  return defaultData();
}

function tgGet(key){
  return new Promise((resolve) => {
    window.Telegram.WebApp.CloudStorage.getItem(key, (err, value) => {
      resolve(err ? null : value);
    });
  });
}
function tgSet(key, value){
  return new Promise((resolve) => {
    window.Telegram.WebApp.CloudStorage.setItem(key, value, () => resolve());
  });
}
function timeoutP(ms){
  return new Promise((resolve) => setTimeout(resolve, ms));
}

async function loadData(){
  const forceReset = new URLSearchParams(window.location.search).has('reset');
  let loadedRaw = null;
  try{
    if(!forceReset){
      if(inTelegram){
        await Promise.race([
          (async () => { loadedRaw = await tgGet(STORAGE_KEY); })(),
          timeoutP(4000)
        ]);
      } else if(window.storage){
        const res = await window.storage.get(STORAGE_KEY, false);
        if(res && res.value) loadedRaw = res.value;
      }
    }
  }catch(e){ /* birinchi marta ishlatilmoqda */ }

  if(loadedRaw){
    try{ data = migrate(JSON.parse(loadedRaw)); }
    catch(e){ data = defaultData(); }
  } else {
    data = defaultData();
  }

  loaded = true;
  render();
  if(forceReset){ saveData(); }
}

async function saveData(){
  try{
    const json = JSON.stringify(data);
    if(inTelegram){
      await tgSet(STORAGE_KEY, json);
    } else if(window.storage){
      await window.storage.set(STORAGE_KEY, json, false);
    }
  }catch(e){ console.error('Saqlashda xatolik', e); }
}

function getActiveCampaign(){
  return data.campaigns.find(c => c.id === data.activeCampaignId) || data.campaigns[0];
}

function switchCampaign(id){
  data.activeCampaignId = id;
  editingTarget = false;
  render();
}

function toggleAddCampaignForm(){
  showAddCampaignForm = !showAddCampaignForm;
  render();
}

function addCampaign(amountStr){
  const amount = parseInt(amountStr, 10);
  if(isNaN(amount) || amount <= 0) return;
  const id = 'c' + Date.now().toString(36);
  data.campaigns.push({ id, amount });
  data.payments[id] = {};
  data.activeCampaignId = id;
  showAddCampaignForm = false;
  saveData();
  render();
}

function removeCampaign(id){
  if(data.campaigns.length <= 1){
    alert("Kamida bitta to'lov turi qolishi kerak.");
    return;
  }
  const c = data.campaigns.find(c => c.id === id);
  if(!confirm((c ? formatSum(c.amount) : 'Bu') + " to'lov turi butunlay o'chirilsinmi? Unga tegishli barcha belgilashlar yo'qoladi.")) return;
  data.campaigns = data.campaigns.filter(c => c.id !== id);
  delete data.payments[id];
  if(data.activeCampaignId === id){
    data.activeCampaignId = data.campaigns[0].id;
  }
  saveData();
  render();
}

function setTarget(val){
  const n = parseInt(val, 10);
  const c = getActiveCampaign();
  c.amount = isNaN(n) || n < 0 ? 0 : n;
  saveData();
  editingTarget = false;
  render();
}
function startEditTarget(){ editingTarget = true; render(); }
function confirmTarget(){
  const input = document.getElementById('targetInput');
  setTarget(input.value);
}

function addPerson(name){
  const trimmed = name.trim();
  if(!trimmed) return;
  const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  data.people.push({ id, name: trimmed });
  saveData();
  render();
}

function deletePerson(id){
  const p = data.people.find(p => p.id === id);
  const name = p ? p.name : "bu odam";
  if(!confirm(name + " ro'yxatdan rostan ham o'chirilsinmi?")) return;
  data.people = data.people.filter(p => p.id !== id);
  Object.keys(data.payments).forEach(cid => { delete data.payments[cid][id]; });
  saveData();
  render();
}

function togglePaid(personId){
  const cid = data.activeCampaignId;
  if(!data.payments[cid]) data.payments[cid] = {};
  if(data.payments[cid][personId]) delete data.payments[cid][personId];
  else data.payments[cid][personId] = true;
  saveData();
  render();
}

function toggleStats(){
  showStats = !showStats;
  render();
}

function resetToDefaults(){
  if(!confirm("Hammasi asl holatga qaytarilsinmi? Barcha to'lov turlari, belgilashlar va qo'shimcha odamlar yo'qoladi.")) return;
  data = defaultData();
  saveData();
  render();
}

function onSearchInput(val){
  searchQuery = val;
  render();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render(){
  const app = document.getElementById('app');
  if(!loaded || !data){
    app.innerHTML = '<div class="loading">Yuklanmoqda...</div>';
    return;
  }

  const active = getActiveCampaign();
  const cid = active.id;
  const paidSet = data.payments[cid] || {};
  const total = data.people.length;
  const paidCount = data.people.filter(p => paidSet[p.id]).length;
  const collected = paidCount * active.amount;
  const targetSum = total * active.amount;
  const pct = targetSum > 0 ? Math.min(100, Math.round((collected/targetSum)*100)) : 0;

  const tabsHtml = data.campaigns.map(c => `
    <button class="tab-btn ${c.id === cid ? 'active' : ''}" onclick="switchCampaign('${c.id}')">${formatSum(c.amount)}</button>
  `).join('') + `<button class="tab-btn add-tab" onclick="toggleAddCampaignForm()">+ Yangi tur</button>`;

  let grandCollected = 0, grandTarget = 0;
  const statsRows = data.campaigns.map(c => {
    const set = data.payments[c.id] || {};
    const paid = data.people.filter(p => set[p.id]).length;
    const col = paid * c.amount;
    const tgt = data.people.length * c.amount;
    grandCollected += col;
    grandTarget += tgt;
    return `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
        <div>
          <div style="font-weight:600;font-size:14px;">${formatSum(c.amount)}</div>
          <div style="font-size:12px;color:var(--ink-soft);">${paid}/${data.people.length} kishi to'ladi</div>
        </div>
        <div style="font-family:'Fraunces',serif;font-size:15px;color:var(--gold);">${formatSum(col)}</div>
      </div>
    `;
  }).join('');

  const statsHtml = showStats ? `
    <div class="card" style="margin-bottom:14px;">
      <div style="font-size:13px;color:var(--ink-soft);margin-bottom:8px;">Barcha turlar bo'yicha hisobot</div>
      ${statsRows}
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;margin-top:4px;">
        <div style="font-weight:700;font-size:15px;">Jami yig'ildi</div>
        <div style="font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--paid);">${formatSum(grandCollected)} <span style="font-size:13px;color:var(--ink-soft);font-weight:400;font-family:'Inter',sans-serif;">/ ${formatSum(grandTarget)}</span></div>
      </div>
    </div>
  ` : '';

  const addCampaignFormHtml = showAddCampaignForm ? `
    <div class="add-campaign-form">
      <input id="newCampaignAmount" type="number" inputmode="numeric" placeholder="Masalan: 50000">
      <button onclick="addCampaign(document.getElementById('newCampaignAmount').value)">Qo'shish</button>
    </div>
  ` : '';

  const targetHtml = editingTarget
    ? `<div class="target-value"><input id="targetInput" type="number" inputmode="numeric" value="${active.amount}" autofocus></div>
       <div class="btn-row"><button class="edit-btn" onclick="confirmTarget()">Saqlash</button></div>`
    : `<div class="target-value">${formatSum(active.amount)}</div>
       <div class="btn-row">
         <button class="edit-btn" onclick="startEditTarget()">O'zgartirish</button>
         <button class="remove-campaign-btn" onclick="removeCampaign('${cid}')">O'chirish</button>
       </div>`;

  const q = searchQuery.trim().toLowerCase();
  let filteredPeople = q
    ? data.people.filter(p => p.name.toLowerCase().includes(q))
    : data.people.slice();

  // To'lamaganlar tepada, to'laganlar pastda (har bir guruh ichida asl tartib saqlanadi)
  filteredPeople = filteredPeople
    .map((p, idx) => ({ p, idx, paid: !!paidSet[p.id] }))
    .sort((a, b) => (a.paid === b.paid ? a.idx - b.idx : (a.paid ? 1 : -1)))
    .map(x => x.p);

  const peopleHtml = data.people.length === 0
    ? '<div class="empty">Hali odam qo\'shilmagan.<br>Pastdan ism kiriting.</div>'
    : (filteredPeople.length === 0
      ? '<div class="empty">Hech kim topilmadi.</div>'
      : filteredPeople.map(p => {
        const isPaid = !!paidSet[p.id];
        return `
        <div class="person ${isPaid ? 'paid' : ''}">
          <div class="person-left">
            <span class="person-name">${escapeHtml(p.name)}</span>
          </div>
          <div style="display:flex;align-items:center;">
            <button class="status-btn ${isPaid ? 'paid' : 'pending'}" onclick="togglePaid('${p.id}')">${isPaid ? "✓ To'ladi" : "To'lamadi"}</button>
            <button class="delete-btn" onclick="deletePerson('${p.id}')" aria-label="O'chirish">×</button>
          </div>
        </div>
      `;
      }).join(''));

  app.innerHTML = `
    <header>
      <h1>Pul yig'ish</h1>
      <p class="subtitle">${total} kishi ro'yxatda · ${paidCount} tasi to'ladi (${formatSum(active.amount)} bo'yicha)</p>
      <div style="display:flex;gap:14px;margin-top:8px;">
        <button class="reset-link" onclick="toggleStats()">${showStats ? 'Hisobotni yopish' : 'Umumiy hisobot'}</button>
        <button class="reset-link" onclick="resetToDefaults()">Ro'yxatni asl holatga qaytarish</button>
      </div>
    </header>

    ${statsHtml}

    <div class="tabs-row">${tabsHtml}</div>
    ${addCampaignFormHtml}

    <div class="card">
      <div class="target-row">
        <div class="target-label">Ushbu tur bo'yicha yig'iladigan summa</div>
      </div>
      <div class="target-row" style="margin-top:8px;">${targetHtml}</div>
    </div>

    <div class="card progress-card">
      <div class="progress-top">
        <div class="progress-sum">${formatSum(collected)} <span class="of">/ ${formatSum(targetSum)}</span></div>
        <div class="progress-people">${pct}%</div>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="Ism bo'yicha qidirish..." value="${escapeHtml(searchQuery)}" oninput="onSearchInput(this.value)">
    </div>

    <div class="list-label"><span>Odamlar ro'yxati</span><span>${filteredPeople.length}/${total}</span></div>
    <div id="peopleList">${peopleHtml}</div>
  `;

  if(editingTarget){
    const input = document.getElementById('targetInput');
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') confirmTarget(); });
  }
  if(showAddCampaignForm){
    const input = document.getElementById('newCampaignAmount');
    if(input){
      input.focus();
      input.addEventListener('keydown', (e) => { if(e.key === 'Enter') addCampaign(input.value); });
    }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadData();
});
</script>

<div class="add-bar">
  <div class="add-bar-inner">
    <input id="addPersonInput" type="text" placeholder="Ism kiriting..." maxlength="40">
    <button class="add-btn" id="addBtn">Qo'shish</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('addPersonInput');
  const btn = document.getElementById('addBtn');
  btn.addEventListener('click', () => {
    addPerson(input.value);
    input.value = '';
    input.focus();
  });
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      addPerson(input.value);
      input.value = '';
    }
  });
});
</script>
</body>
</html>
